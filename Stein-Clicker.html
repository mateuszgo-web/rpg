<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stein-Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--panel:#c6c6c6;--hi:#fff;--lo:#555;--ink:#1c1c1c;--dim:#484848;--ok:#256b29;--slot:#8b8b8b;--wa:#2a78c8;--wb:#63b8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2c2c2c;--hi:#4b4b4b;--lo:#0b0b0b;--ink:#eee;--dim:#a9a9a9;--ok:#7bd36f;--slot:#1d1d1d;--wa:#07203f;--wb:#0f4780}}
:root[data-theme="dark"]{--panel:#2c2c2c;--hi:#4b4b4b;--lo:#0b0b0b;--ink:#eee;--dim:#a9a9a9;--ok:#7bd36f;--slot:#1d1d1d;--wa:#07203f;--wb:#0f4780}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--wa);color:var(--ink);font:16px/1.4 "Silkscreen",ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
#water{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--wb),var(--wa))}
#water i{position:absolute;inset:0;background-repeat:repeat;animation:flow 12s linear infinite}
#water i:nth-child(1){background-image:radial-gradient(ellipse 50px 9px at 60px 20px,rgba(255,255,255,.22),transparent 72%);background-size:120px 40px}
#water i:nth-child(2){background-image:radial-gradient(ellipse 90px 14px at 100px 35px,rgba(255,255,255,.14),transparent 72%);background-size:200px 70px;animation-duration:20s;--mx:-200px;--my:70px}
#water i:nth-child(3){background-image:radial-gradient(ellipse 140px 22px at 150px 60px,rgba(255,255,255,.09),transparent 72%);background-size:300px 120px;animation-duration:32s;--mx:-300px;--my:120px}
@keyframes flow{to{background-position:var(--mx,-120px) var(--my,40px)}}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}header,.mats{grid-column:1/-1}}
@media(min-width:1000px){main{grid-template-columns:minmax(170px,2fr) minmax(0,5fr) minmax(0,6fr)}.mats{grid-column:auto}}
h1{font-size:28px;margin:0}
h2{font-size:18px;margin:0 0 12px}
header p{margin:6px 0 0;font-size:14px}
header h1,header p{color:#fff;text-shadow:2px 2px 0 rgba(0,35,80,.75)}
.panel{background:var(--panel);padding:18px;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.stage{text-align:center;position:relative;overflow:hidden}
.count{font-size:34px;font-weight:700}
.rates{color:var(--dim);font-size:13px;margin:4px 0 14px;white-space:pre-line}
#arena{position:relative;width:min(100%,256px);margin:0 auto}
#arena::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:14px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),transparent 70%);z-index:0}
#block{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block;position:relative;z-index:1;width:100%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform-origin:50% 90%}
#block canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#block:focus-visible{outline:4px solid var(--ok);outline-offset:6px}
#tool{position:absolute;right:-5%;bottom:-4%;width:112px;height:112px;image-rendering:pixelated;opacity:0;pointer-events:none;z-index:3;transform-origin:85% 85%}
#pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;image-rendering:pixelated}
.hint{color:var(--dim);font-size:13px;margin:22px 0 0;min-height:20px}
.pop{position:absolute;pointer-events:none;font-weight:700;color:var(--ink);animation:up .8s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#list{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;padding:12px 14px;font:inherit;color:var(--ink);background:var(--slot);border:0;cursor:pointer;box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.rec:disabled{cursor:not-allowed;opacity:.55}
.rec:not(:disabled):hover{filter:brightness(1.12)}
.rec:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.rec b{font-size:16px}
.rec .own{text-align:right;font-size:18px;font-weight:700}
.rec small{color:var(--dim);font-size:12px}
.rec .cost{text-align:right;font-size:12px}
.rec:not(:disabled) .cost{color:var(--ok)}
.mats table{width:100%;border-collapse:collapse}
.mats td{padding:9px 4px;border-bottom:2px solid var(--slot)}
.mats tr:last-child td{border-bottom:0}
.mats td:last-child{text-align:right;font-weight:700}
.mats tr.zero{opacity:.5}
.rec[hidden]{display:none}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;font:inherit;color:var(--ink);background:var(--slot);border:0;padding:10px 8px;cursor:pointer;box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.tabs button[aria-selected=true]{background:var(--panel);font-weight:700;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.tabs button:not([aria-selected=true]):hover{filter:brightness(1.12)}
.tabs button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.ic{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.35)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--dim)}
.foot button{font:inherit;color:var(--ink);background:var(--slot);border:0;padding:6px 10px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
@media(prefers-reduced-motion:reduce){#water i{animation:none}.pop{animation:none;opacity:0}}
.cop{display:block;font-size:18px;color:#8a3f12;min-height:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cop{color:#ff9a5c}}
:root[data-theme="dark"] .cop{color:#ff9a5c}
#block.cu #cu{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px rgba(216,175,147,.4))}to{filter:drop-shadow(0 0 16px rgba(235,200,170,.9))}}
@media(prefers-reduced-motion:reduce){#block.cu #cu{animation:none}}
</style>
</head>
<body>
<div id="water" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
<header>
<h1>Stein-Clicker</h1>
<p>Baue Stein ab und craft daraus Werkzeuge und Maschinen.</p>
</header>

<section class="panel mats" aria-label="Materialien">
<h2>Materialien</h2>
<table id="mats"><tbody></tbody></table>
</section>

<section class="panel stage" aria-label="Abbauen">
<div class="count"><span id="stone">0</span></div>
<div class="rates" id="rates"></div>
<div id="arena">
<button id="block" aria-label="Auf den Stein schlagen"><canvas id="cv" width="256" height="256"></canvas><canvas id="cu" width="256" height="256" style="display:none"></canvas><canvas id="cr" width="256" height="256"></canvas></button>
<canvas id="tool" width="16" height="16" aria-hidden="true"></canvas>
</div>
<p class="hint" id="hint"></p>
</section>

<section class="panel" aria-label="Crafting">
<h2>Werkbank</h2>
<div class="tabs" role="tablist"><button role="tab" id="tab-m" aria-selected="false">Materialien</button><button role="tab" id="tab-t" aria-selected="true">Werkzeuge</button></div>
<div id="list" role="tabpanel"></div>
<div class="foot"><span>Insgesamt abgebaut: <span id="total">0</span></span><span><button id="snd">Ton: an</button> <button id="reset">Zurücksetzen</button></span></div>
</section>
</main>

<script>
(function(){
var HP=100,YIELD=1,RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
// Schlagkraft: Hand 2 (50 Schläge), Spitzhacke 2,5 (40), Schaufel 4 (25)
var REC=[
{id:'pick',n:'Steinspitzhacke',d:'+20 % Abbaugeschwindigkeit (einmalig)',c:25,k:.4,once:1},
{id:'furnace',n:'Steinofen',d:'+1 Stein pro Sekunde',c:60,s:1},
{id:'shovel',n:'Steinschaufel',d:'+75 % Abbaugeschwindigkeit (einmalig)',c:120,k:1.5,once:1},
{id:'anvil',n:'Steinamboss',d:'+6 Stein pro Sekunde',c:500,s:6},
{id:'golem',n:'Steingolem',d:'+30 Stein pro Sekunde',c:3000,s:30},
{id:'ipick',n:'Eisenspitzhacke',d:'Upgrade: +60 % statt +20 % Abbaugeschwindigkeit',fe:10,k:.8,once:1,req:'pick'}
];
var KEY='stein-clicker-v3',st={stone:0,total:0,dmg:0,own:{},t:2};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p.stone==='number')st=p;}}catch(e){}
if(!st.own)st.own={};if(!st.dmg)st.dmg=0;if(st.t==null)st.t=2;
if(st.copper){st.iron=(st.iron||0)+st.copper}delete st.copper;
function fmt(n){return (Math.floor(n*10+1e-9)/10).toLocaleString('de-DE',{maximumFractionDigits:1})}
function own(r){return st.own[r.id]||0}
function cost(r){return r.once?r.c:Math.ceil(r.c*Math.pow(1.15,own(r)))}
function reqOk(r){return !r.req||(st.own[r.req]||0)>0}
function canBuy(r){return r.fe?((st.iron||0)>=r.fe&&reqOk(r)):st.stone>=cost(r)}
function dmgHit(){return REC.reduce(function(a,r){return a+(r.k||0)*(own(r)>0?1:0)},2)}
function perSec(){return REC.reduce(function(a,r){return a+(r.s||0)*own(r)},0)}
function toolName(){return own(REC[2])>0?'Steinschaufel':(st.own.ipick>0)?'Eisenspitzhacke':own(REC[0])>0?'Steinspitzhacke':'Hand'}

// ---- Stein-Texturen (bereinigt, echtes Pixelraster) ----
var TEX=[{"u":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAABsklEQVR4nKVXsZGEMAw0zKdfwjdAgGcogE4IyCjpMgI6oQBmREADV8IVwAe8eVmWZAFKGIylldZr2RTOYNXP947ft/ensPhp9mUBbb0no3AmcjcJFTiAzgDReJzIvSTEiRwoBqyaOpq/LWs0N5dElmoMGsC2ZU0T/fsWnq9x2jXw0grMgWg29F0iykvArfcuFZdcNR5vvRfBWaqxkqXqLFVXTZ0IM5hasSX4XZ9La8zRm5snrXVEtSYG5+zVWOadFYd1xWLiKnwylgDzbZE3TixchVjhHN0lBp0BRBU6d1TReu9e48R+u2LnGkuAIaCWkOYnJWRumUPfRUG3ZY0oDtTiZ2pwtlHTdqJBtMYggdIxEbhqanVbDH2X0Hil4STA+BQKwaR1utrZsLpvUY2Nq9qi8HJ7f4oZwOEtpTk+oRfbeVDTGwelnILjb7KKeXuN0z/VtPIQkDMLnaaWyYFbGkbYzxxQjoFEXBQ8l7m27TRfVtWUdhpAaqNXqlavoLlTCwtRAuOEOAPovfroq8eFnSYwA6C7M+yYHQxEWQl+5pt/7v+JY4cTaPB7/POlJUfBsP0CqSQuUSdcZUwAAAAASUVORK5CYII=","w":30,"h":30,"sc":8,"y":2,"hp":200},{"u":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAYAAAByDd+UAAABcklEQVR4nK2WsXGEMBBFPwypS3ADF1gzLoBOHDhzSWQEdEIBzIiABq6EKwAHnj1Ly1+dhNiIY7R6fP3d1TUgcXt/29n77f5o2PuS6Bisd85Y7vdaaJQssNn7aFHvHG6fHwCAYZyqlLY5sCuj0zANEGUAsC0r3aTE86eHAhPAtqwRTOD6BFIfyzx/AkOYVmaFhvGcGNqSFebRJeEExt51gJy1pz6EUVuhAGkLedZHxGC6Zy0bwtyo8eMN/R4WSEpZjt8Sh0mTAzBzSGXroEVzBgTkKaUqrEYGjsrFx1T/Av8+Fg5vQPeVrvDZ+6TSCKjnaW4zC7R3Dr1zSS/N4W3BrI22+6ORXD3+KLAkfr6/qM8CFZUspwXsq+lMhEpZRB5KsbwyPgcqhaT36cKqrIFY0ANQHq6EhdBhnPbwNx1tr+Al15ceFMVVui0rZu9PX1MHYOrra2EA0FijTB/rME5/0Csu4BDK/gzVqjoABWotugoGAL/JVgj0aiifZwAAAABJRU5ErkJggg==","w":28,"h":28,"sc":7,"y":0.5,"hp":50},{"u":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAaCAYAAACkVDyJAAABrElEQVR4nK1Wy42EMAw1aK5bwjbAASQKmE44cKMkbhzoJAUgmQMNUAIFsAfkjOPYITM7TxppAkme/fyjgExUvz+nfLbtR5F7nvDIJXs2jfIGz3eJbzdysqqt/fNtWf16nOZs0jKHzCEGZAAADtH/H/pOlfwtQk6m4dk0ME5zsM4hVQntmF0gOYe+82uAPE+TknLvtmX1Pylv1dZ+752nEaEmJfdWknGQxCnSoCzu4qYlDwdJ/AKeMns9oSTjXlkGECiGOSgkmZUsQYxEPXqjhffbsoJDDGo0kJRfZlmteUuGagl1OfCS9mF1EocYxYTIZELFsQsN4VB76TjN0SVkjIyxJiM9D++4vPRl4RCvnrisZhyrtjbf8Xu0OiWYMfwEqWylWJrjSUsAiaqtPYlWTnKvQww9pENVW/vLtBLgStA+Hq+UseW2H0Wq/ngP5UbRWpMxpYwvfLJcepzqOHK/NaBp7RCh4HWoXSilpYND30Xz8M7YbT+KKGmoI/Buzy21Pyswmg7BeKNOc/2xP4bu5p+88A4lbZYHKJmI9FtITnyL9D8GZMnwrY9gAIA/eXJNKD91P9YAAAAASUVORK5CYII=","w":28,"h":26,"sc":7,"y":1,"hp":100}];
var seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var cvS=document.getElementById('cv'),cvC=document.getElementById('cu'),cc=document.getElementById('cr').getContext('2d');
var STC=["#927e6a", "#684c3c", "#2a1d0d"],CUC=['#d8af93','#c49a7c','#a67c60','#8d8d8d','#6f6f6f','#e6c4a8'];
var IMG=[],MASK=[],PATHS=[],loaded=0;
TEX.forEach(function(t,i){var im=new Image();im.onload=function(){var o=document.createElement('canvas');o.width=t.w;o.height=t.h;var og=o.getContext('2d');og.drawImage(im,0,0);var d=og.getImageData(0,0,t.w,t.h).data,m=[];for(var k=0;k<t.w*t.h;k++)m.push(d[k*4+3]>0?1:0);MASK[i]=m;loaded++;if(loaded===TEX.length)show()};im.src=t.u;IMG.push(im)});
function curT(){return st.cu?4:st.t}
function curHP(){return st.cu?100:TEX[st.t].hp}
function curY(){return st.cu?2:TEX[st.t].y}
function px(){return TEX[curT()].sc}
function pickT(){var n;do{n=Math.floor(Math.random()*3)}while(n===st.t);return n}
function drawTex(cv,i,copper){var g=cv.getContext('2d'),t=TEX[i],w=t.w*t.sc,h=t.h*t.sc,x=Math.round((256-w)/2),y=240-h;
g.clearRect(0,0,256,256);g.imageSmoothingEnabled=false;
if(!copper){g.drawImage(IMG[i],x,y,w,h);return}
var o=document.createElement('canvas');o.width=t.w;o.height=t.h;var og=o.getContext('2d');og.drawImage(IMG[i],0,0);
var d=og.getImageData(0,0,t.w,t.h),p=d.data;
for(var k=0;k<p.length;k+=4){if(!p[k+3])continue;var l=(p[k]*.3+p[k+1]*.59+p[k+2]*.11)/255,u=Math.min(1,Math.max(0,(l-.1)*1.5)),pat=u>.45&&((k/4*2654435761)>>>0)%100<16;
p[k]=pat?216:60+u*130;p[k+1]=pat?175:60+u*125;p[k+2]=pat?147:64+u*118}
og.putImageData(d,0,0);g.drawImage(o,x,y,w,h);
g.fillStyle='#fff';var s=t.sc;[[.3,.3],[.68,.45],[.45,.72],[.6,.15]].forEach(function(q){var sx=Math.round((x+w*q[0])/s)*s,sy=Math.round((y+h*q[1])/s)*s;g.fillRect(sx,sy-2*s,s,s);g.fillRect(sx-s,sy-s,3*s,s);g.fillRect(sx-2*s,sy,5*s,s);g.fillRect(sx-s,sy+s,3*s,s);g.fillRect(sx,sy+2*s,s,s)})}

// Risse im Pixelraster der Textur
function mkPath(i){var t=TEX[i],m=MASK[i],cells=[],out=[],seen={},ws=[];
for(var k=0;k<t.w*t.h;k++)if(m[k])cells.push([k%t.w,(k/t.w)|0]);
for(k=0;k<7;k++){var c=cells[Math.floor(rnd()*cells.length)];ws.push({x:c[0],y:c[1],a:rnd()*6.28})}
for(var s=0;s<18;s++)ws.forEach(function(q){q.a+=(rnd()-.5)*1.1;q.x+=Math.cos(q.a)*1.15;q.y+=Math.sin(q.a)*1.15;var cx=Math.round(q.x),cy=Math.round(q.y),key=cx+','+cy;if(cx>=0&&cy>=0&&cx<t.w&&cy<t.h&&m[cy*t.w+cx]&&!seen[key]){seen[key]=1;out.push([cx,cy])}});
return out}
function cracks(p){cc.clearRect(0,0,256,256);if(loaded<TEX.length)return;var i=curT(),t=TEX[i],pa=PATHS[i]||(PATHS[i]=mkPath(i)),n=Math.floor(pa.length*p),ox=Math.round((256-t.w*t.sc)/2),oy=240-t.h*t.sc;
cc.fillStyle='#120b04';for(var k=0;k<n;k++)cc.fillRect(ox+pa[k][0]*t.sc,oy+pa[k][1]*t.sc,t.sc,t.sc)}

// ---- Sprites ----
var tl=document.getElementById('tool'),tx=tl.getContext('2d'),curTool='';
function R(c,x,y,w,h){tx.fillStyle=c;tx.fillRect(x,y,w,h)}
function sprite(t){tx.clearRect(0,0,16,16);
if(t==='Hand'){R('#2a1d0d',2,3,9,9);R('#2a1d0d',1,4,1,7);R('#d6a77a',2,4,8,7);R('#ecc9a2',2,4,8,2);R('#b07f55',2,10,8,1);R('#b07f55',4,6,1,4);R('#b07f55',6,6,1,4);R('#b07f55',8,6,1,4);R('#2a1d0d',10,5,3,6);R('#d6a77a',10,6,3,4);R('#1f7f8c',13,3,3,10);R('#2fa6b4',13,4,3,8)}
else{for(var i=0;i<=9;i++){R('#7a5230',2+i,14-i,1,1);R('#5c3d22',3+i,14-i,1,1)}
for(var x=6;x<=15;x++){var y=3+Math.round((x-11)*(x-11)/10);R('#c4c4c4',x,y,1,1);R('#8e8e8e',x,y+1,1,1);R('#5f5f5f',x,y+2,1,1)}}}

var blk=document.getElementById('block'),arena=document.getElementById('arena'),stage=document.querySelector('.stage'),list=document.getElementById('list'),btns={};
REC.forEach(function(r){
var b=document.createElement('button');b.className='rec';
b.innerHTML='<b>'+r.n+'</b><span class="own"></span><small>'+r.d+'</small><span class="cost"></span>';
b.onclick=function(){if(r.once&&own(r)>0)return;if(!canBuy(r))return;if(r.fe)st.iron-=r.fe;else st.stone-=cost(r);st.own[r.id]=own(r)+1;draw();save()};
list.appendChild(b);btns[r.id]=b;
});

// ---- Werkbank-Reiter (Materialien / Werkzeuge) ----
function grp(r){return r.k?'t':'m'}
var tabBtns={m:document.getElementById('tab-m'),t:document.getElementById('tab-t')},tabName={m:'Materialien',t:'Werkzeuge'};
function renderTabs(){var g=st.tab||'t';REC.forEach(function(r){btns[r.id].hidden=grp(r)!==g});
['m','t'].forEach(function(x){var on=x===g,af=!on&&REC.some(function(r){return grp(r)===x&&!(r.once&&own(r)>0)&&canBuy(r)});tabBtns[x].setAttribute('aria-selected',on?'true':'false');tabBtns[x].textContent=tabName[x]+(af?' ●':'')})}
function setTab(g){st.tab=g;renderTabs();save()}
tabBtns.m.onclick=function(){setTab('m')};tabBtns.t.onclick=function(){setTab('t')};

// ---- Materialien-Tabelle ----
var MATS=[{n:'Stein',c:'#927e6a',a:function(){return st.stone},v:function(){return fmt(st.stone)}},{n:'Eisen',c:'#d8af93',a:function(){return st.iron||0},v:function(){return (st.iron||0).toLocaleString('de-DE')}}];
var matBody=document.querySelector('#mats tbody');
MATS.forEach(function(m){var tr=document.createElement('tr');tr.innerHTML='<td><i class="ic" style="background:'+m.c+'"></i>'+m.n+'</td><td></td>';m.tr=tr;m.val=tr.lastChild;matBody.appendChild(tr)});
function renderMats(){MATS.forEach(function(m){m.tr.className=m.a()>=1?'':'zero';m.val.textContent=m.v()})}

function draw(){
var d=dmgHit(),t=toolName();
if(t!==curTool){curTool=t;sprite(t==='Hand'?'Hand':'Pick')}
document.getElementById('stone').textContent=fmt(st.stone)+' Stein';
document.getElementById('total').textContent=fmt(st.total);
renderMats();renderTabs();
document.getElementById('rates').textContent=t+' · '+Math.ceil(curHP()/d)+' Schläge pro Block\n'+fmt(curY())+(st.cu?' Eisen':' Stein')+' pro Block · '+perSec()+' pro Sekunde';
REC.forEach(function(r){var b=btns[r.id],c=cost(r),o=own(r),done=r.once&&o>0;
b.disabled=done||!canBuy(r);
b.querySelector('.own').textContent=done?'✓':(o?'×'+o:'');
b.querySelector('.cost').textContent=done?'Gecraftet':r.fe?(reqOk(r)?'Kosten: '+r.fe+' Eisen':'Benötigt: Steinspitzhacke'):'Kosten: '+fmt(c)+' Stein';});
document.getElementById('hint').textContent=st.cu?'Ein Eisenblock! Schlag zu.':(own(REC[0])>0&&!st.own.ipick&&(st.iron||0)>=10)?'Genug Eisen! Rüste deine Spitzhacke auf.':(own(REC[0])===0&&st.stone>=25)?'Genug Stein! Craft deine Steinspitzhacke.':(st.total===0?'Klicke den Block, um zu schlagen.':'');
}
var lastSave=0;
function save(){var n=Date.now();if(n-lastSave<1500)return;lastSave=n;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

// ---- Animationen (Pixel-Stil: harte Schritte) ----
var ST='steps(1,end)';
function swing(){if(RM)return;tl.animate([
{opacity:1,transform:'translate(28%,22%) rotate(35deg)',easing:ST},
{opacity:1,transform:'translate(-52%,-42%) rotate(-25deg)',offset:.35,easing:ST},
{opacity:1,transform:'translate(-40%,-32%) rotate(-12deg)',offset:.6,easing:ST},
{opacity:0,transform:'translate(-20%,-15%) rotate(0deg)',offset:.85}],{duration:240})}
function impact(broke,cu,oT){var s=px();
if(!broke&&!RM)blk.animate([{transform:'translate(0,0)',easing:ST},{transform:'translate('+(-s)+'px,'+s+'px)',offset:.34,easing:ST},{transform:'translate('+s+'px,0)',offset:.67,easing:ST},{transform:'none'}],{duration:150});
if(broke)shatter(oT,cu);else chips(16,false,cu)}
// Minecraft-Partikel: kleine Pixel-Quadrate in den Farben der Textur, mit Schwerkraft
var pc=document.createElement('canvas');pc.id='pc';pc.setAttribute('aria-hidden','true');stage.appendChild(pc);
var pg=pc.getContext('2d'),parts=[],raf=0,lastT=0,COL=[];
function texCols(i){if(COL[i])return COL[i];var t=TEX[i],o=document.createElement('canvas');o.width=t.w;o.height=t.h;var g=o.getContext('2d');g.drawImage(IMG[i],0,0);var d=g.getImageData(0,0,t.w,t.h).data,a=[];for(var k=0;k<d.length;k+=4)if(d[k+3]){var pi=k/4;a.push([d[k],d[k+1],d[k+2],pi%t.w,(pi/t.w)|0])}return COL[i]=a}
function tick(ts){var dt=Math.min(.05,(ts-lastT)/1000||.016);lastT=ts;pg.clearRect(0,0,pc.width,pc.height);
for(var i=parts.length-1;i>=0;i--){var p=parts[i];if(p.d>0){p.d-=dt;pg.globalAlpha=1;pg.fillStyle=p.c;pg.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz);continue}p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}
p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>p.gy){p.y=p.gy;p.vx=0;p.vy=0;p.l=Math.min(p.l,.25)}pg.globalAlpha=p.l<.2?p.l/.2:1;var rx=Math.round(p.x),ry=Math.round(p.y);pg.fillStyle='#120b04';pg.fillRect(rx-1,ry-1,p.sz+2,p.sz+2);pg.fillStyle=p.c;pg.fillRect(rx,ry,p.sz,p.sz)}
pg.globalAlpha=1;raf=parts.length?requestAnimationFrame(tick):0}
function chips(n,big,cu){if(loaded<TEX.length)return;n=big?44:16;
var sr=stage.getBoundingClientRect(),br=blk.getBoundingClientRect(),i=curT(),t=TEX[i],k=br.width/256,s=t.sc*k;
if(pc.width!==stage.clientWidth||pc.height!==stage.clientHeight){pc.width=stage.clientWidth;pc.height=stage.clientHeight}
var w=t.w*t.sc*k,h=t.h*t.sc*k,x0=br.left-sr.left+(br.width-w)/2,y0=br.top-sr.top+240*k-h,cols=texCols(i),gy=y0+h+4*k,cx=x0+w/2;
// Wie in Minecraft: Partikel lösen sich aus Pixeln des Blocks und fallen nach unten
for(var j=0;j<n&&parts.length<150;j++){var q=cols[Math.floor(Math.random()*cols.length)],f=.75+Math.random()*.4,c;
if(cu)c=CUC[Math.floor(Math.random()*CUC.length)];
else c='rgb('+Math.min(255,q[0]*f|0)+','+Math.min(255,q[1]*f|0)+','+Math.min(255,q[2]*f|0)+')';
var ppx=x0+q[3]*s,ppy=y0+q[4]*s,dir=ppx<cx?-1:1;
parts.push({x:ppx,y:ppy,vx:(dir*(30+Math.random()*90)+(Math.random()-.5)*60)*k*(big?1.4:1),vy:-Math.random()*(big?200:110)*k,g:1100*k,gy:gy+Math.random()*6*k,sz:Math.max(5,Math.round(s*(.65+Math.random()*.4))),c:c,l:.9+Math.random()*.5})}
if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick)}}
// ---- Soundeffekte (Web Audio, synthetisch) ----
var AC=null,muted=false,sndB=document.getElementById('snd');
try{muted=localStorage.getItem(KEY+'-mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noise(a,dur,f0,f1,vol){var n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);var s=a.createBufferSource();s.buffer=b;var f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;f.frequency.setValueAtTime(f0,a.currentTime);f.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);var g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
function tone(a,f0,f1,dur,vol,type,delay){var t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur)}
function sfx(kind){if(muted)return;var a=ac();if(!a)return;
if(kind==='hit'){noise(a,.12,1100+Math.random()*500,350,.5);tone(a,150+Math.random()*30,70,.09,.25)}
else if(kind==='break'){noise(a,.4,900,150,.7);tone(a,110,45,.25,.35);noise(a,.18,700,200,.35)}
else if(kind==='cu'){noise(a,.1,1800,500,.35);tone(a,1100+Math.random()*100,800,.12,.12,'square')}
else if(kind==='cubreak'){noise(a,.3,1500,300,.5);tone(a,988,988,.1,.15,'square');tone(a,1319,1319,.2,.15,'square',.09)}}
function sndLbl(){sndB.textContent='Ton: '+(muted?'aus':'an')}
sndLbl();sndB.onclick=function(){muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch(e){}sndLbl();if(!muted)sfx('hit')};
// Zersplittern: jedes Pixel des Blocks löst sich nacheinander, von der Mitte nach außen
function shatter(i,cu){if(RM||loaded<TEX.length){chips(44,true,cu);return}
var t=TEX[i],sr=stage.getBoundingClientRect(),br=blk.getBoundingClientRect(),k=br.width/256,s=t.sc*k;
if(pc.width!==stage.clientWidth||pc.height!==stage.clientHeight){pc.width=stage.clientWidth;pc.height=stage.clientHeight}
var tmp=document.createElement('canvas');tmp.width=tmp.height=256;var tg=tmp.getContext('2d');tg.drawImage(cu?cvC:cvS,0,0);tg.drawImage(document.getElementById('cr'),0,0);
var dat=tg.getImageData(0,0,256,256).data,ox=Math.round((256-t.w*t.sc)/2),oy=240-t.h*t.sc,x0=br.left-sr.left+ox*k,y0=br.top-sr.top+oy*k,gy=br.top-sr.top+240*k+4*k,list=[],mx=0,my=0;
for(var y=0;y<t.h;y++)for(var x=0;x<t.w;x++){var sx=Math.min(255,Math.floor(ox+(x+.5)*t.sc)),sy=Math.min(255,Math.floor(oy+(y+.5)*t.sc)),o=(sy*256+sx)*4;if(dat[o+3]<128)continue;list.push([x,y,'rgb('+dat[o]+','+dat[o+1]+','+dat[o+2]+')']);mx+=x;my+=y}
if(!list.length)return;mx/=list.length;my/=list.length;
var maxd=0;list.forEach(function(q){q[3]=Math.sqrt((q[0]-mx)*(q[0]-mx)+(q[1]-my)*(q[1]-my));if(q[3]>maxd)maxd=q[3]});
var sz=Math.ceil(s);
list.forEach(function(q){var len=q[3]||1,sp=(40+Math.random()*100)*k;
parts.push({x:x0+q[0]*s,y:y0+q[1]*s,sz:sz,c:q[2],d:q[3]/maxd*.46+Math.random()*.04,vx:(q[0]-mx)/len*sp+(Math.random()-.5)*40*k,vy:(q[1]-my)/len*sp*.6-Math.random()*120*k,g:1100*k,gy:gy+Math.random()*6*k,l:.7+Math.random()*.5})});
if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick)}}
function breakAnim(){if(RM)return;var s=px();blk.animate([{opacity:0,easing:ST},{opacity:0,offset:.72,easing:ST},{opacity:1,transform:'translateY(-'+3*s+'px)',offset:.72,easing:ST},{opacity:1,transform:'translateY(-'+s+'px)',offset:.86,easing:ST},{opacity:1,transform:'none'}],{duration:700})}

function pop(t){var sr=stage.getBoundingClientRect(),br=blk.getBoundingClientRect(),s=document.createElement('span');s.className='pop';s.textContent=t;s.style.left=(br.left-sr.left+br.width/2-30)+'px';s.style.top=(br.top-sr.top+br.height/2-10)+'px';stage.appendChild(s);setTimeout(function(){s.remove()},850)}
function show(){if(loaded<TEX.length)return;var c=!!st.cu;drawTex(cvS,st.t,0);if(c)drawTex(cvC,2,1);cvS.style.display=c?'none':'block';cvC.style.display=c?'block':'none';blk.classList.toggle('cu',c);cracks(st.dmg/curHP())}
function hit(){
st.dmg+=dmgHit();var broke=st.dmg>=curHP(),wasCu=!!st.cu,y=curY(),oT=curT();
if(broke){st.dmg=0;if(wasCu){st.iron=(st.iron||0)+1;st.cu=0;st.t=pickT()}else{st.stone+=y;st.total+=y;if(Math.random()<.1)st.cu=1;else st.t=pickT()}}
sfx(broke?(wasCu?'cubreak':'break'):(wasCu?'cu':'hit'));
swing();draw();save();
setTimeout(function(){impact(broke,wasCu,oT);cracks(st.dmg/curHP());
if(broke){breakAnim();pop(wasCu?'+1 Eisen':'+'+fmt(y)+' Stein');setTimeout(show,RM?0:200)}},RM?0:90);
}
// Gedrückt halten = dauerhaft abbauen (Maus, Touch, Stift)
var holdT=null;
function stopHold(){if(holdT){clearInterval(holdT);holdT=null}}
blk.addEventListener('pointerdown',function(e){if(e.button!==undefined&&e.button!==0)return;stopHold();hit();holdT=setInterval(hit,230)});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){blk.addEventListener(ev,stopHold)});
window.addEventListener('blur',stopHold);
blk.addEventListener('contextmenu',function(e){e.preventDefault()});
// Tastatur (Enter/Leertaste) löst nur click ohne Zeiger aus
blk.addEventListener('click',function(e){if(e.detail===0)hit()});

setInterval(function(){var s=perSec();if(s){st.stone+=s/10;st.total+=s/10;draw();save()}},100);
document.getElementById('reset').onclick=function(){
if(confirm('Wirklich alles zurücksetzen?')){st={stone:0,total:0,dmg:0,own:{},t:2};try{localStorage.removeItem(KEY)}catch(e){}show();draw()}
};
window.addEventListener('pagehide',function(){lastSave=0;save()});
show();draw();
})();
</script>
</body>
</html>
