<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stein-Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--panel:#c6c6c6;--hi:#fff;--lo:#555;--ink:#1c1c1c;--dim:#484848;--ok:#256b29;--bad:#9c1f17;--slot:#8b8b8b;--wa:#2a78c8;--wb:#63b8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2c2c2c;--hi:#4b4b4b;--lo:#0b0b0b;--ink:#eee;--dim:#a9a9a9;--ok:#7bd36f;--bad:#ff8a7a;--slot:#1d1d1d;--wa:#07203f;--wb:#0f4780}}
:root[data-theme="dark"]{--panel:#2c2c2c;--hi:#4b4b4b;--lo:#0b0b0b;--ink:#eee;--dim:#a9a9a9;--ok:#7bd36f;--bad:#ff8a7a;--slot:#1d1d1d;--wa:#07203f;--wb:#0f4780}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--wa);color:var(--ink);font:16px/1.4 "Silkscreen",ui-monospace,Menlo,Consolas,monospace;min-height:100vh}
#water{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--wb),var(--wa))}
#water i{position:absolute;inset:0;background-repeat:repeat;animation:flow 12s linear infinite}
#water i:nth-child(1){background-image:radial-gradient(ellipse 50px 9px at 60px 20px,rgba(255,255,255,.22),transparent 72%);background-size:120px 40px}
#water i:nth-child(2){background-image:radial-gradient(ellipse 90px 14px at 100px 35px,rgba(255,255,255,.14),transparent 72%);background-size:200px 70px;animation-duration:20s;--mx:-200px;--my:70px}
#water i:nth-child(3){background-image:radial-gradient(ellipse 140px 22px at 150px 60px,rgba(255,255,255,.09),transparent 72%);background-size:300px 120px;animation-duration:32s;--mx:-300px;--my:120px}
@keyframes flow{to{background-position:var(--mx,-120px) var(--my,40px)}}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
header,.mats{grid-column:1/-1}
@media(min-width:900px){main{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.stage{position:sticky;top:12px}.storebody{max-height:calc(100vh - 260px);overflow-y:auto;overscroll-behavior:contain}}

h1{font-size:28px;margin:0}
h2{font-size:18px;margin:0 0 12px}
header p{margin:6px 0 0;font-size:14px}
header h1,header p{color:#fff;text-shadow:2px 2px 0 rgba(0,35,80,.75)}
.panel{background:var(--panel);padding:18px;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.stage{text-align:center;position:relative;overflow:hidden}
.count{font-size:40px;font-weight:700;line-height:1.15;text-shadow:3px 3px 0 var(--hi)}
.rates{color:var(--dim);font-size:13px;margin:4px 0 14px;white-space:pre-line}
#arena{position:relative;width:min(100%,256px);margin:0 auto}
#arena::after{content:"";position:absolute;left:12%;right:12%;bottom:-6px;height:14px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),transparent 70%);z-index:0}
#block{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block;position:relative;z-index:1;width:100%;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transform-origin:50% 90%}
#block canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#block:focus-visible{outline:4px solid var(--ok);outline-offset:6px}
#tool{position:absolute;right:-5%;bottom:-4%;width:112px;height:112px;image-rendering:pixelated;opacity:0;pointer-events:none;z-index:3;transform-origin:85% 85%}
#pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;image-rendering:pixelated}
.hint{color:var(--dim);font-size:13px;margin:22px 0 0;min-height:20px}
.pop.lucky{color:#f2c230;text-shadow:2px 2px 0 #5b3d00;font-size:18px}
.pop{white-space:nowrap;position:absolute;pointer-events:none;font-weight:700;color:var(--ink);animation:up .8s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#list{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:60px 1fr auto;gap:3px 12px;align-items:center;text-align:left;width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--slot);border:0;border-left:6px solid var(--lo);cursor:pointer;box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi);transition:transform .08s}
.rec:disabled{cursor:not-allowed;opacity:.72}
.rec.can{opacity:1;background:color-mix(in srgb,var(--slot) 76%,var(--ok));border-left-color:var(--ok)}
.rec.can:hover{transform:translateX(4px)}
.rec.done{opacity:.55;border-left-color:var(--slot)}
.rec:not(:disabled):hover{filter:brightness(1.12)}
.rec:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.rec b{font-size:17px;grid-column:2;grid-row:1}
.rec .own{text-align:right;font-size:20px;font-weight:700;opacity:.8;grid-column:3;grid-row:1}
.rec small{color:var(--dim);font-size:12px;grid-column:2/4;grid-row:2}
.rec .cost{display:flex;flex-wrap:wrap;gap:5px;align-items:center;grid-column:2/4;grid-row:4;margin-top:3px}
.rec .pips{grid-column:2/4;grid-row:3;display:flex;gap:3px;margin-top:2px}
.rec .pips:empty{display:none}
.pips i{width:14px;height:7px;background:var(--lo);opacity:.45}
.pips i.on{background:var(--ok);opacity:1}
.slot,.sellrow .slot{grid-row:1/5;grid-column:1;display:grid;place-items:center;width:58px;height:58px;background:var(--panel);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.ico{width:48px;height:48px;image-rendering:pixelated;display:block}
.ico.sm{width:32px;height:32px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px;font-size:12px;background:var(--panel);color:var(--dim);box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.chip .ic{width:10px;height:10px;margin:0}
.chip.ok{color:var(--ok)}
.chip.no{color:var(--bad)}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--dim);margin-right:2px}
.intro{color:var(--dim);font-size:12px;margin:0 0 10px;min-height:30px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 0 0;padding:6px 10px;background:repeating-linear-gradient(180deg,#7b5a30 0 7px,#6d4f29 7px 8px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.sec:first-child{margin-top:0}
.sec b{font-size:14px;color:#f6e6c4;text-shadow:2px 2px 0 #3a2814}
.sec span{color:#e8d3a8;font-size:12px;text-align:right}
.mats{padding:10px}
#mats,#mats tbody{display:block}
#mats tbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
#mats tr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
#mats td{display:block;padding:0;border:0}
#mats td:first-child{font-size:12px;color:var(--dim)}
#mats td:last-child{font-size:22px;font-weight:700;text-align:left}
#mats tr.zero{opacity:.5}




.rec[hidden]{display:none}
.storehead{background:repeating-linear-gradient(180deg,#7b5a30 0 7px,#6d4f29 7px 8px);padding:10px 14px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.storehead h2{margin:0;color:#f6e6c4;text-shadow:2px 2px 0 #3a2814;font-size:20px;letter-spacing:1px}
.store{padding:0;overflow:hidden}
.storebody{padding:14px}
.tabs{display:flex;margin:0;background:#3a2a18}
.tabs button{flex:1 1 0;min-width:0;white-space:nowrap;font:inherit;font-size:12px;color:#e8d3a8;background:#5b4326;border:0;border-right:3px solid #2a1d0f;border-bottom:4px solid #2a1d0f;padding:12px 2px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);font-weight:700;border-bottom-color:var(--panel)}
.tabs button:not([aria-selected=true]):hover{filter:brightness(1.12)}
.tabs button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.ic{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.35)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0;padding:10px 14px;border-top:3px solid var(--lo);font-size:12px;color:var(--dim)}
.foot button{font:inherit;color:var(--ink);background:var(--slot);border:0;padding:6px 10px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
#sell{display:grid;gap:10px}
#arts{display:grid;gap:10px}
.artsum{display:grid;gap:4px}
.artsum .sec{margin:0}
.upghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.upghead b{font-size:14px}
.upghead button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:0;padding:7px 10px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.upghead button:disabled{opacity:.45;cursor:not-allowed}
.upghead button:not(:disabled):hover{filter:brightness(1.12)}
.upgbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;min-height:72px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.upg{position:relative;width:56px;height:56px;padding:0;border:0;display:grid;place-items:center;cursor:pointer;background:var(--panel);opacity:.5;filter:grayscale(.7);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.upg .ico{width:40px;height:40px}
.upg .lv{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;color:var(--ink);text-shadow:1px 1px 0 var(--panel)}
.upg.can{opacity:1;filter:none;outline:3px solid var(--ok);outline-offset:-3px}
.upg.can:hover{transform:translateY(-2px)}
.upg.max{opacity:1;filter:none;outline:3px solid #f2c230;outline-offset:-3px;cursor:default}
.upg.sel{box-shadow:0 0 0 3px #f2c230,inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.upg:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
#tip{position:fixed;z-index:50;width:min(300px,calc(100vw - 24px));padding:10px 12px;background:#1c1c1c;color:#f0f0f0;font-size:13px;pointer-events:none;box-shadow:0 0 0 3px #555,6px 6px 0 rgba(0,0,0,.5)}
#tip[hidden]{display:none}
#tip .th{display:flex;align-items:center;gap:10px}
#tip .th .ico{width:40px;height:40px;image-rendering:pixelated}
#tip b{font-size:15px}
#tip .lvl{margin-left:auto;color:#f2c230;font-size:12px}
#tip p{margin:8px 0 0;color:#cfcfcf}
#tip .tc{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#tip .chip{background:#333;color:#cfcfcf}
#tip .chip.ok{color:#7bd36f}
#tip .chip.no{color:#ff8a7a}
#tip .tag{color:#aaa}
#tip .tm{color:#f2c230}
#sell[hidden],#arts[hidden]{display:none}
.coinline{display:flex;align-items:center;gap:12px;margin:0;padding:10px 14px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.coinline b{font-size:22px;display:block}
.coinline small{display:block;color:var(--dim);font-size:12px;font-weight:400}
.sellrow{display:grid;grid-template-columns:58px 1fr auto;gap:3px 12px;align-items:center;padding:12px 14px;background:var(--slot);box-shadow:inset 3px 3px 0 var(--lo),inset -3px -3px 0 var(--hi)}
.sellrow b{grid-column:2;grid-row:1;font-size:16px}
.sellrow small{color:var(--dim);font-size:12px;grid-column:2}
.sellbtns{grid-row:1/5;grid-column:3;display:flex;gap:6px}
@media(max-width:480px){.sellrow{grid-template-columns:58px 1fr}.sellbtns{grid-column:1/-1;grid-row:auto}.sellbtns button{flex:1}}
.sellbtns button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:0;padding:8px 10px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.sellbtns button:disabled{opacity:.45;cursor:not-allowed}
.sellbtns button:not(:disabled):hover{filter:brightness(1.12)}
.sellbtns button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#water i{animation:none}}
.cop{display:block;font-size:18px;color:#8a3f12;min-height:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cop{color:#ff9a5c}}
:root[data-theme="dark"] .cop{color:#ff9a5c}
#block.cu #cu{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 4px rgba(216,175,147,.4))}to{filter:drop-shadow(0 0 16px rgba(235,200,170,.9))}}
#block.cu.my #cu{animation:glowm 1.6s ease-in-out infinite alternate}
@keyframes glowm{from{filter:drop-shadow(0 0 4px rgba(60,200,240,.45))}to{filter:drop-shadow(0 0 18px rgba(120,240,255,.95))}}
@media(prefers-reduced-motion:reduce){#block.cu #cu,#block.cu.my #cu{animation:none}}
</style>
</head>
<body>
<div id="water" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
<header>
<h1>Stein-Clicker</h1>
<p>Baue Stein ab, craft Werkzeuge, verkaufe Ressourcen und sammle Artefakte.</p>
</header>

<section class="panel mats" aria-label="Materialien">
<table id="mats"><tbody></tbody></table>
</section>

<section class="panel stage" aria-label="Abbauen">
<div class="count"><span id="stone">0</span></div>
<div class="rates" id="rates"></div>
<div id="arena">
<button id="block" aria-label="Auf den Stein schlagen"><canvas id="cv" width="256" height="256"></canvas><canvas id="cu" width="256" height="256" style="display:none"></canvas><canvas id="cr" width="256" height="256"></canvas></button>
<canvas id="tool" width="16" height="16" aria-hidden="true"></canvas>
</div>
<p class="hint" id="hint"></p>
</section>

<section class="panel store" aria-label="Werkbank">
<div class="storehead"><h2>Werkbank</h2></div>
<div class="tabs" role="tablist"><button role="tab" id="tab-t" aria-selected="true">Werkzeuge</button><button role="tab" id="tab-m" aria-selected="false">Maschinen</button><button role="tab" id="tab-s" aria-selected="false">Verkaufen</button><button role="tab" id="tab-a" aria-selected="false">Artefakte</button></div>
<div class="storebody">
<p class="intro" id="intro"></p>
<div id="list" role="tabpanel"></div>
<div id="sell" role="tabpanel" hidden></div>
<div id="arts" role="tabpanel" hidden></div>
</div>
<div class="foot"><span>Insgesamt abgebaut: <span id="total">0</span></span><span><button id="snd">Ton: an</button> <button id="reset">Zurücksetzen</button></span></div>
</section>
</main>

<script>
(function(){
// Abbau-Animationen sind das Spiel-Feedback und laufen immer (die OS-Einstellung "Bewegung reduzieren" hat sie am PC komplett abgeschaltet)
var HP=100,YIELD=1,RM=false;
// Schlagkraft: Hand 2 (50 Schläge), Spitzhacke 2,5 (40)
var REC=[
{id:'pick',n:'Steinspitzhacke',d:'+20 % Abbaugeschwindigkeit (einmalig)',c:25,k:.4,once:1,up:'ipick'},
{id:'furnace',n:'Steinofen',d:'+1 Stein pro Sekunde',c:60,s:1},
{id:'anvil',n:'Steinamboss',d:'+6 Stein pro Sekunde',c:500,s:6},
{id:'golem',n:'Steingolem',d:'+30 Stein pro Sekunde',c:3000,s:30},
{id:'ipick',n:'Eisenspitzhacke',d:'Upgrade: +60 % statt +20 % Abbaugeschwindigkeit',fe:10,k:.8,once:1,req:'pick',hide:1},
{id:'m1',n:'Fractured Mythril Pickaxe',d:'+40 % Abbaugeschwindigkeit (Stufe 1/4)',my:3,k:.8,once:1,up:'m2'},
{id:'m2',n:'Bandaged Mythril Pickaxe',d:'Upgrade (Stufe 2/4): weitere +40 %',my:6,k:.8,once:1,req:'m1',hide:1,up:'m3'},
{id:'m3',n:'Mythril Pickaxe',d:'Upgrade (Stufe 3/4): weitere +60 %',my:12,k:1.2,once:1,req:'m2',hide:1,up:'m4'},
{id:'m4',n:'Refined Mythril Pickaxe',d:'Upgrade (Stufe 4/4): weitere +80 %',my:25,k:1.6,once:1,req:'m3',hide:1}
];
// Artefakte: kaufen (Münzen) oder craften (Materialien), danach Stufe für Stufe upgraden
// t = Bonus-Art (speed = Mining Speed, luck = Mining Luck), per = Bonus in % pro Stufe, lv = Kosten je Stufe (c Münzen, s Stein, fe Eisen, my Mythril)
var ART=[
{id:'a_coin',n:'Glücksmünze',t:'luck',per:8,how:'buy',col:'#f2c230',lv:[{c:40},{c:120},{c:350},{c:900},{c:2200}]},
{id:'a_glove',n:'Eilhandschuh',t:'speed',per:10,how:'buy',col:'#e0e0e0',lv:[{c:60},{c:180},{c:500},{c:1300},{c:3000}]},
{id:'a_clover',n:'Eisenkleeblatt',t:'luck',per:12,how:'craft',col:'#d8af93',lv:[{s:150,fe:5},{s:400,fe:10},{s:1000,fe:20},{s:2500,fe:35}]},
{id:'a_ring',n:'Eisenring',t:'speed',per:15,how:'craft',col:'#a67c60',lv:[{s:200,fe:6},{s:500,fe:12},{s:1200,fe:24},{s:3000,fe:40}]},
{id:'a_amulet',n:'Mythril-Amulett',t:'luck',per:25,how:'craft',col:'#4fd6e8',lv:[{fe:10,my:2},{fe:20,my:5},{fe:40,my:10}]},
{id:'a_crystal',n:'Mythril-Kristall',t:'speed',per:35,how:'craft',col:'#2b6fd0',lv:[{fe:12,my:3},{fe:25,my:6},{fe:45,my:12}]}
];
// Verkaufspreise (Münzen pro Stück)
var SELL=[{k:'stone',n:'Stein',p:1,c:'#927e6a'},{k:'iron',n:'Eisen',p:20,c:'#d8af93'},{k:'myth',n:'Mythril',p:100,c:'#4fd6e8'}];
var KEY='stein-clicker-v3',st={stone:0,total:0,dmg:0,own:{},t:2};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p.stone==='number')st=p;}}catch(e){}
if(!st.own)st.own={};if(!st.art)st.art={};if(!st.dmg)st.dmg=0;if(st.t==null)st.t=2;
if(st.copper){st.iron=(st.iron||0)+st.copper}delete st.copper;
if(st.own.shovel){st.stone+=120;delete st.own.shovel}
function fmt(n){return (Math.floor(n*10+1e-9)/10).toLocaleString('de-DE',{maximumFractionDigits:1})}
function own(r){return st.own[r.id]||0}
function cost(r){return r.once?r.c:Math.ceil(r.c*Math.pow(1.15,own(r)))}
function reqOk(r){return !r.req||(st.own[r.req]||0)>0}
function canBuy(r){return r.fe?((st.iron||0)>=r.fe&&reqOk(r)):r.my?((st.myth||0)>=r.my&&reqOk(r)):st.stone>=cost(r)}
// Ein Upgrade erscheint auf dem Knopf seines Vorgängers (z. B. Eisenspitzhacke auf dem Knopf der Steinspitzhacke)
function cur(r){var x=r;while(x.up&&own(x)>0)x=REC.filter(function(q){return q.id===x.up})[0];return x}
function artLv(a){return (st.art&&st.art[a.id])||0}
function artPct(t){return ART.reduce(function(s,a){return a.t===t?s+a.per*artLv(a):s},0)}
function luck(){return artPct('luck')/100}
function oreCh(){return Math.min(.6,.25+luck()*.1)}
function myCh(){return (st.own&&st.own.ipick>0)?.05:0}
function canPay(c){return (st.coins||0)>=(c.c||0)&&st.stone>=(c.s||0)&&(st.iron||0)>=(c.fe||0)&&(st.myth||0)>=(c.my||0)}
function pay(c){st.coins=(st.coins||0)-(c.c||0);st.stone-=(c.s||0);st.iron=(st.iron||0)-(c.fe||0);st.myth=(st.myth||0)-(c.my||0)}
function costStr(c){var q=[];if(c.c)q.push(fmt(c.c)+' Münzen');if(c.s)q.push(fmt(c.s)+' Stein');if(c.fe)q.push(c.fe+' Eisen');if(c.my)q.push(c.my+' Mythril');return q.join(' + ')}
function artBuyable(a){var l=artLv(a);return l<a.lv.length&&canPay(a.lv[l])}

parts.push({x:x0+q[0]*s,y:y0+q[1]*s,sz:sz,c:q[2],d:q[3]/maxd*.46+Math.random()*.04,vx:(q[0]-mx)/len*sp+(Math.random()-.5)*40*k,vy:(q[1]-my)/len*sp*.6-Math.random()*120*k,g:1100*k,gy:gy+Math.random()*6*k,l:.7+Math.random()*.5})});
if(!raf){lastT=performance.now();raf=requestAnimationFrame(tick)}}
function breakAnim(){if(RM)return;var s=px();blk.animate([{opacity:0,easing:ST},{opacity:0,offset:.72,easing:ST},{opacity:1,transform:'translateY(-'+3*s+'px)',offset:.72,easing:ST},{opacity:1,transform:'translateY(-'+s+'px)',offset:.86,easing:ST},{opacity:1,transform:'none'}],{duration:700})}

function pop(t,cls){var sr=stage.getBoundingClientRect(),br=blk.getBoundingClientRect(),s=document.createElement('span');s.className='pop'+(cls?' '+cls:'');s.textContent=t;s.style.top=(br.top-sr.top+br.height/2-10)+'px';stage.appendChild(s);s.style.left=(br.left-sr.left+br.width/2-s.offsetWidth/2)+'px';setTimeout(function(){s.remove()},850)}
function show(){if(loaded<TEX.length)return;var c=!!st.cu;drawTex(cvS,st.t,0);if(c)drawTex(cvC,curT(),st.cu===2?2:1);cvS.style.display=c?'none':'block';cvC.style.display=c?'block':'none';blk.classList.toggle('cu',c);blk.classList.toggle('my',st.cu===2);cracks(st.dmg/curHP())}
var bonusEx=0;
function hit(){
bonusEx=0;st.dmg+=dmgHit();var broke=st.dmg>=curHP(),wasCu=st.cu||0,y=curY(),oT=curT();
if(broke){st.dmg=0;var lk=luck(),ex=Math.floor(lk)+(Math.random()<lk%1?1:0);y=y*(1+ex);bonusEx=ex;if(wasCu){if(wasCu===2)st.myth=(st.myth||0)+y;else st.iron=(st.iron||0)+y;st.cu=0;st.t=pickT()}else{st.stone+=y;st.total+=y;var rr=Math.random();if(rr<oreCh()){st.cu=rr<myCh()?2:1;st.ct=Math.floor(Math.random()*TEX.length)}else st.t=pickT()}}
sfx(broke?(wasCu===2?'mybreak':wasCu?'cubreak':'break'):(wasCu===2?'my':wasCu?'cu':'hit'));
swing();draw();save();
setTimeout(function(){impact(broke,wasCu,oT);cracks(st.dmg/curHP());
if(broke){breakAnim();var bx=bonusEx;pop((wasCu?'+'+fmt(y)+(wasCu===2?' Mythril':' Eisen'):'+'+fmt(y)+' Stein')+(bx?' · Glück ×'+(1+bx):''),bx?'lucky':'');setTimeout(show,RM?0:200)}},RM?0:90);
}
// Gedrückt halten = dauerhaft abbauen (Maus, Touch, Stift)
var holdT=null;
function stopHold(){if(holdT){clearInterval(holdT);holdT=null}}
blk.addEventListener('pointerdown',function(e){if(e.button!==undefined&&e.button!==0)return;stopHold();hit();holdT=setInterval(hit,230)});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){blk.addEventListener(ev,stopHold)});
window.addEventListener('blur',stopHold);
blk.addEventListener('contextmenu',function(e){e.preventDefault()});
// Tastatur (Enter/Leertaste) löst nur click ohne Zeiger aus
blk.addEventListener('click',function(e){if(e.detail===0)hit()});

setInterval(function(){var s=perSec();if(s){st.stone+=s/10;st.total+=s/10;draw();save()}},100);
document.getElementById('reset').onclick=function(){
if(confirm('Wirklich alles zurücksetzen?')){st={stone:0,total:0,dmg:0,own:{},art:{},coins:0,t:2};try{localStorage.removeItem(KEY)}catch(e){}show();draw()}
};
window.addEventListener('pagehide',function(){lastSave=0;save()});
show();draw();
})();
